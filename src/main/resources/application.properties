spring.datasource.url=${dbUrl:jdbc:postgresql://${dbHost:localhost}:${dbPort:5432}/${dbName:blogdb}}
spring.datasource.username=${dbUsername:postgres}
spring.datasource.password=${dbPassword:}
spring.datasource.driver-class-name=org.postgresql.Driver

server.port=${PORT:8080}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

openai.api.url=https://api.groq.com/openai/v1/chat/completions
openai.api.key=${GROQ_API_KEY:}
