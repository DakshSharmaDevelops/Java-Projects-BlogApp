<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${post.title}">View Post</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div class="container">
    <a th:href="@{/}" style="text-decoration: none; color: #007bff; font-weight: bold;">← Back to Post List</a>

    <div class="post-header" style="margin-top: 15px;">
        <h1 th:text="${post.title}">Blog Title</h1>
        <div class="post-meta">
            By <strong th:text="${post.author}">Author</strong> |
            Published: <span th:text="${#temporals.format(post.publishedAt, 'MMMM dd, yyyy HH:mm')}">Date</span>
        </div>
    </div>

    <div class="tags">
        <span th:each="t : ${post.tags}" class="tag-badge" th:text="'#' + ${t.name}">#tag</span>
    </div>

    <div class="post-content" th:text="${post.content}">
        Full post content...
    </div>

    <!-- Comments Section -->
    <div class="comments-section">
        <h3>Comments (<span th:text="${post.comments.size()}">0</span>)</h3>

        <!-- Add Comment Form -->
        <div class="comment-form">
            <h4>Leave a Comment</h4>
            <form th:action="@{/comments/create}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="postId" th:value="${post.id}" />

                <div class="form-group">
                    <input type="text" name="name" placeholder="Your Name" required/>
                </div>
                <div class="form-group">
                    <input type="email" name="email" placeholder="Your Email Address" required/>
                </div>
                <div class="form-group">
                    <textarea name="comment" rows="3" placeholder="Write your comment..." required></textarea>
                </div>
                <button type="submit" class="btn">Submit Comment</button>
            </form>
        </div>

        <!-- Comments List -->
        <div th:each="c : ${post.comments}" class="comment-card">
            <div class="comment-meta">
                <span th:text="${c.name}">Name</span>
                <small style="color: #6c757d; font-weight: normal;" th:text="'(' + ${c.email} + ')'">(Email)</small>
            </div>
            <p th:text="${c.comment}" style="margin: 8px 0;">Comment content</p>

            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <!-- Edit Comment Inline Form -->
                <form th:action="@{/comments/update}" method="post" style="display:flex; gap: 5px; flex: 1;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="postId" th:value="${post.id}" />
                    <input type="hidden" name="commentId" th:value="${c.id}" />
                    <input type="text" name="commentText" th:value="${c.comment}" required style="flex:1;" />
                    <button type="submit" class="btn" style="background:#28a745;">Update</button>
                </form>

                <!-- Delete Comment Form -->
                <form th:action="@{/comments/delete}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="postId" th:value="${post.id}" />
                    <input type="hidden" name="commentId" th:value="${c.id}" />
                    <button type="submit" class="btn btn-danger" onclick="return confirm('Delete this comment?')">Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
